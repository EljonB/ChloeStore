<script>
    function moveSlide(button, direction) {
        const container = button.parentElement.querySelector('.carousel-images');
        let currentSlide = container.dataset.currentSlide ? parseInt(container.dataset.currentSlide) : 0;
        const slides = container.querySelectorAll('img');

        currentSlide += direction;
        if (currentSlide < 0) currentSlide = slides.length - 1;
        if (currentSlide >= slides.length) currentSlide = 0;

        container.dataset.currentSlide = currentSlide;
        container.style.transform = `translateX(-${currentSlide * 100}%)`;
    }

    function toggleMenu() {
        const navbar = document.querySelector('.navbar');
        navbar.classList.toggle('active');
    }

    

    
function redirectToOrderPage(name, images) {
    const imageParams = images.map(img => encodeURIComponent(img)).join(',');
    window.location.href = `order.html?name=${encodeURIComponent(name)}&images=${imageParams}`;
}

</script>
